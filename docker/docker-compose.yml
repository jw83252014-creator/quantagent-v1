services:
  quantagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - LIVE_TRADING_ENABLED=false
    volumes:
      - ../knowledge-base:/app/knowledge-base
  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - ../n8n:/home/node/.n8n
